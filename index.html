<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171816">
  <meta name="description" content="QRPass – digitales Betriebsmittelbuch per QR-Code.">
  <title>QRPass – Betriebsmittelbuch</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="company.css">
  <link rel="stylesheet" href="header-fix.css">
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="employees.css">
  <link rel="stylesheet" href="audit.css">
  <link rel="stylesheet" href="archive.css">
  <link rel="stylesheet" href="history-admin.css">
  <link rel="stylesheet" href="account.css">
  <link rel="stylesheet" href="pilot.css">
  <link rel="stylesheet" href="legal.css">
  <link rel="stylesheet" href="inspections.css">
  <link rel="stylesheet" href="import-v12.css">
  <link rel="stylesheet" href="reminder-v13.css">
  <script defer src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script defer src="legal-config.js"></script>
  <script defer src="pilot.js"></script>
  <script defer src="qr-flow.js"></script>
  <script defer src="auth.js"></script>
  <script defer src="recovery.js"></script>
  <script defer src="employees.js"></script>
  <script defer src="logo-processor.js"></script>
  <script defer src="company.js"></script>
  <script defer src="contrast.js"></script>
  <script defer src="app.js"></script>
  <script defer src="audit-ui.js"></script>
  <script defer src="archive-ui.js"></script>
  <script defer src="inspections.js"></script>
  <script defer src="history-admin.js"></script>
  <script defer src="account.js"></script>
  <script defer src="import-v12.js"></script>
  <script defer src="reminder-v13.js"></script>
  <script defer src="legal.js"></script>
  <script defer src="terminology-v11.js"></script>
</head>
<body>
  <header class="topbar">
    <button class="brand" data-action="home" aria-label="Zur Übersicht">
      <span class="brand-mark">QR</span>
      <span><strong>QRPass</strong><small>Betriebsmittelbuch</small></span>
    </button>
    <div class="top-actions">
      <button class="button button-primary" data-action="add-machine">+ Betriebsmittel</button>
    </div>
  </header>

  <main id="app" class="app-shell" aria-live="polite"></main>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="assertive"></div>

  <template id="modal-template">
    <div class="modal-backdrop">
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" data-stop-close>
        <header class="modal-header">
          <div>
            <p class="eyebrow" id="modal-eyebrow"></p>
            <h2 id="modal-title"></h2>
          </div>
          <button class="icon-button" data-action="close-modal" aria-label="Schließen">×</button>
        </header>
        <div id="modal-body" class="modal-body"></div>
      </section>
    </div>
  </template>

  <noscript>QRPass benötigt JavaScript.</noscript>
</body>
</html>
